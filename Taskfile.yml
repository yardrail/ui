version: '3'

tasks:
  install:
    internal: true
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules/.modules.yaml
    cmd: pnpm install --frozen-lockfile

  build:
    desc: Build CSS/JS to pkg/dist/ (ui.js, ui.css and their source maps)
    deps: [install]
    cmd: pnpm build

  gen:
    desc: Compile .templ files to *_templ.go
    cmd: templ generate

  gen:check:
    desc: Verify committed codegen output (*_templ.go, dist/) is up to date with its sources
    cmds:
      - task: gen
      - task: build
      - git add -N -- 'pkg/*_templ.go' pkg/dist/
      - git diff --exit-code -- 'pkg/*_templ.go' pkg/dist/

  fmt:
    desc: Run all formatters (writes to files)
    cmds:
      - task: fmt:go
      - task: fmt:templ
      - task: fmt:web

  fmt:web:
    desc: Format TypeScript and CSS files
    cmd: biome format --write .

  fmt:go:
    desc: Format Go files
    cmd: golangci-lint fmt ./...

  fmt:templ:
    desc: Format .templ files
    cmd: templ fmt .

  lint:
    desc: Run all lints (read-only)
    cmds:
      - task: lint:go
      - task: lint:templ
      - task: lint:biome
      - task: lint:css

  lint:go:
    desc: Run Go lints
    cmd: golangci-lint run --max-same-issues 50 ./...

  lint:templ:
    desc: Verify .templ files are formatted
    cmd: templ fmt . --check

  lint:biome:
    desc: Lint TypeScript and CSS (Biome rules)
    deps: [install]
    cmds:
      - pnpm exec tsc --noEmit
      - biome lint .

  lint:css:
    desc: Lint hand-written CSS
    deps: [install]
    cmd: pnpm exec stylelint "src/**/*.css" "pkg/**/*.css" "!pkg/dist/**" "cmd/gallery/gallery.css" "cmd/gallery/mocks.css"

  test:
    desc: Run Go tests
    cmd: go test ./...

  docs:
    desc: Regenerate CLAUDE.md and README.md from templates and source
    cmd: go run ./scripts/gen-docs/

  docs:check:
    desc: Fail if CLAUDE.md or README.md is out of date
    cmds:
      - task: docs
      - git diff --exit-code -- CLAUDE.md README.md

  gallery:
    desc: Serve every component example on :6007 with live reload via air
    deps: [build]
    cmd: air
