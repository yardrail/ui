version: '3'

tasks:
  install:
    desc: Install npm dependencies (esbuild, stylelint)
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules/.modules.yaml
    cmd: pnpm install --frozen-lockfile

  build:
    desc: Build src/ to dist/ (ui.js, ui.css and their source maps)
    deps: [install]
    cmd: pnpm build

  gen:
    desc: Compile .templ files to *_templ.go
    cmd: templ generate

  gen:check:
    desc: Verify committed codegen output (*_templ.go, dist/) is up to date with its sources
    cmds:
      - task: gen
      - task: build
      # -N (intent-to-add) surfaces newly generated, untracked files to git diff
      # so a new .templ file whose output was never committed fails the check too.
      - git add -N -- '*_templ.go' dist/
      - git diff --exit-code -- '*_templ.go' dist/

  test:
    desc: Run Go tests
    cmd: go test ./...

  lint:
    desc: Run all lints
    cmds:
      - task: lint:go
      - task: lint:css

  lint:go:
    desc: Run Go lints
    cmds:
      - golangci-lint config verify
      - golangci-lint fmt ./...
      - golangci-lint run --fix --max-same-issues 50 ./...

  lint:css:
    desc: Lint hand-written CSS in src/ and the gallery's stylesheet
    deps: [install]
    cmd: pnpm exec stylelint "src/**/*.css" "cmd/gallery/gallery.css"

  gallery:
    desc: Serve every component example on :6007 with live reload via air
    deps: [build]
    cmd: air
