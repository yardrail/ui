pre-commit:
  jobs:
    - name: build
      run: mise exec -- task build
    - name: lint-and-test
      group:
        parallel: true
        jobs:
          - name: lint
            run: mise exec -- task lint:short
          - name: test
            run: mise exec -- task ui:test:short

commit-msg:
  commands:
    commitlint:
      run: mise exec -- commitlint lint --message {1}
