name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: jdx/mise-action@v2

      - run: task test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: jdx/mise-action@v2

      - name: Read tool versions from mise
        id: versions
        run: |
          echo "golangci-lint=v$(mise current golangci-lint)" >> "$GITHUB_OUTPUT"

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.versions.outputs.golangci-lint }}
          install-only: true

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - run: corepack enable

      - run: task lint

      - run: task gen:check
