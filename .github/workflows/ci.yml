name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Go build and module cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-${{ runner.os }}-

      - uses: jdx/mise-action@v5

      - run: task build

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Go build and module cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-lint-${{ runner.os }}-

      - uses: jdx/mise-action@v5

      - run: task lint:short

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Go build and module cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-

      - uses: jdx/mise-action@v5

      - run: task ui:test:short

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Read tool versions from mise
        id: versions
        run: |
          echo "trivy=v$(mise current trivy)" >> "$GITHUB_OUTPUT"

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ steps.versions.outputs.trivy }}
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ steps.versions.outputs.trivy }}
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL

      - name: Trivy license scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ steps.versions.outputs.trivy }}
          scan-type: fs
          scan-ref: .
          scanners: license
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
